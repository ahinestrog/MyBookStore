apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mybookstore-cluster
  region: us-east-1
  version: "1.28"

# Nodos
nodeGroups:
  - name: mybookstore-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    ssh:
      allow: false
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        externalDNS: true
        certManager: true
        appMesh: true
        ebs: true
        fsx: true
        efs: true
        albIngress: true
        cloudWatch: true

# Configuración de red
vpc:
  cidr: 10.0.0.0/16
  nat:
    gateway: Single
